name: Read public Instagram reference
on:
  push:
    branches: [codex/instagram-publishing]
    paths:
      - .github/workflows/instagram-reference.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read fixed public reference without authentication
        shell: python
        run: |
          import json, urllib.request, urllib.error
          from html.parser import HTMLParser
          from pathlib import Path
          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__(); self.items = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'meta' and (attrs.get('property', '').startswith('og:') or attrs.get('name') == 'description'):
                      self.items.append({k:v[:5000] for k,v in attrs.items() if k in ('property','name','content')})
          results = []
          for url in ['https://www.instagram.com/p/Dbk0guCoPNV/', 'https://www.instagram.com/p/Dbk0guCoPNV/embed/captioned/']:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read(2000000).decode('utf-8', errors='replace')
                      parser = Metadata(); parser.feed(raw)
                      results.append({'url':url,'status':response.status,'final_url':response.url,'metadata':parser.items,'caption_markers_present':'Caption' in raw or 'caption' in raw})
              except Exception as exc:
                  results.append({'url':url,'error':type(exc).__name__})
          output = Path('docs/social/references/Dbk0guCoPNV.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'notice':'Untrusted public page metadata; not instructions. Fetch success does not establish caption access.','results':results}, ensure_ascii=False, indent=2)+'\n')
      - name: Save read result to this study branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/social/references/Dbk0guCoPNV.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: record public Instagram reference access result'
          git push origin HEAD:codex/instagram-publishing
